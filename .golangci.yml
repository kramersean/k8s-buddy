version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - misspell
    - unconvert
    - unparam
    - bodyclose
    - errorlint
    - gocritic
    - ineffassign
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - unparam

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
