apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Wraps the single generated manifests.yaml (config/webhook/manifests.yaml,
# `make manifests`'s webhook output -- see plant_controller.go's own header
# comment for why config/rbac follows this exact same "generated file plus a
# thin, hand-written kustomization.yaml wrapper" pattern) so it can be
# referenced as a directory, e.g. `../../../config/webhook`, from
# deploy/kustomize/operator -- kustomize's security policy refuses a bare
# file reference that resolves outside the referencing kustomization's own
# root, but permits a directory reference to another kustomization root
# anywhere on disk.
resources:
  - manifests.yaml
