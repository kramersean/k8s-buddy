# The other half of the operator's metrics gate.
#
# config/rbac/role.yaml (generated from plant_controller.go's own
# +kubebuilder:rbac markers) grants the operator's OWN ServiceAccount the
# tokenreviews/subjectaccessreviews permissions filters.WithAuthentication
# AndAuthorization needs to CHECK a caller's identity and authorization. This
# file is the other side of that check: the permission a CALLER (normally
# Prometheus) must itself hold before the SubjectAccessReview it triggers
# comes back allowed.
#
# `nonResourceURLs` rather than `resources`, because the request being
# authorized is an HTTP path on the operator's own process
# (`:8081/metrics`), never an object read through the Kubernetes API server —
# this is exactly the shape the RBAC system's non-resource-URL rules exist
# for (the same mechanism a raw `/healthz` or `/metrics` check on the API
# server itself uses).
#
# This ClusterRole only defines WHAT the grant is. WHO receives it is a
# separate decision that does not belong here: it depends on the identity of
# whatever ServiceAccount is doing the scraping, which in turn depends on how
# the observability stack was installed (a Helm release name this file has
# no reason to know about). See
# deploy/observability/prometheus-rbac.yaml for the ClusterRoleBinding that
# actually grants this to kube-prometheus-stack's Prometheus ServiceAccount.
#
# Deliberately NOT generated by controller-gen (unlike role.yaml): kubebuilder
# markers describe what the CONTROLLER's own ServiceAccount needs, and have no
# way to express "grant this to some other, externally-defined identity." This
# file is hand-authored for exactly that reason, matching the same split
# kubebuilder's own newer scaffolds use (a generated manager role, plus a
# static, hand-maintained metrics-reader role for external scrapers).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: plant-operator-metrics-reader-role
  labels:
    app.kubernetes.io/name: plant-operator
    app.kubernetes.io/instance: plant-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: k8s-buddy
    app.kubernetes.io/managed-by: kustomize
rules:
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
