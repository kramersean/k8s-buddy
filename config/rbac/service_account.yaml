# The operator's own identity. Unlike buddy-api's ServiceAccount (deploy/
# kustomize/base/serviceaccount.yaml, automountServiceAccountToken: false --
# that workload never talks to the Kubernetes API), this one's whole job IS
# talking to the Kubernetes API: watching Plants and writing their owned
# children. Its Deployment (deploy/kustomize/operator/deployment.yaml)
# deliberately does NOT set automountServiceAccountToken: false, so this
# ServiceAccount's token is mounted into the operator's pod as normal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: plant-operator
  namespace: k8s-buddy-system
  labels:
    app.kubernetes.io/name: plant-operator
    app.kubernetes.io/instance: plant-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: k8s-buddy
    app.kubernetes.io/managed-by: kustomize
