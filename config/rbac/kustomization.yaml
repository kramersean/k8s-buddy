# Bundles the operator's hand-written RBAC (service_account.yaml,
# role_binding.yaml, leader_election_role.yaml,
# leader_election_role_binding.yaml, metrics_reader_role.yaml) and its
# GENERATED role.yaml (see the
# Makefile's `manifests` target -- never hand-edit that file) into a single
# base that deploy/kustomize/operator's own kustomization.yaml pulls in as
# one resource. kustomize's default load restriction forbids a kustomization
# from referencing individual raw resource files outside its own directory
# tree, but permits referencing another directory's kustomization.yaml as a
# base regardless of location -- this file is what makes that possible here.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service_account.yaml
  - role.yaml
  - role_binding.yaml
  - leader_election_role.yaml
  - leader_election_role_binding.yaml
  - metrics_reader_role.yaml
