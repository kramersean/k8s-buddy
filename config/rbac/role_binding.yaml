# Binds the generated plant-operator-role (config/rbac/role.yaml -- see that
# file's own generation comment in the Makefile's `manifests` target) to the
# operator's ServiceAccount. A ClusterRoleBinding, not a namespaced
# RoleBinding, because plant-operator-role is itself a ClusterRole: this
# operator's manager watches Plants across every namespace by default (it is
# never given a --namespace flag restricting it to one), so its permissions
# must be grantable cluster-wide even though every individual verb in
# role.yaml is scoped to a small, specific set of resources -- least
# privilege in WHAT it can touch, not in WHERE.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: plant-operator-rolebinding
  labels:
    app.kubernetes.io/name: plant-operator
    app.kubernetes.io/instance: plant-operator
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: k8s-buddy
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: plant-operator-role
subjects:
  - kind: ServiceAccount
    name: plant-operator
    namespace: k8s-buddy-system
