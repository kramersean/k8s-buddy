# stormy: the dedicated chaos-demo target. It exists so readiness-flap has
# somewhere real to point at -- fernie and spike both leave spec.chaos
# unset, so BUDDY_ENABLE_CHAOS_ENDPOINTS defaults to "false" on their
# generated ConfigMaps (see ChaosSpec in api/v1alpha1/plant_types.go and
# ConfigMapFor in internal/controller/resources.go) and POST
# /chaos/readiness is never even registered on their pods (see
# internal/api/server.go's Handler). A chaos endpoint reachable in an
# ordinary deployment is a security finding, so it stays opt-in per Plant
# rather than on by default -- stormy is the one Plant that opts in, kept
# separate from the two "everyday defaults" samples precisely so the
# default samples stay safe.
#
# namespace is set explicitly rather than left to the caller's current
# context, mirroring plant-fernie.yaml and plant-spike.yaml's own comment:
# a Plant applied with no namespace lands in `default`, which carries
# neither Pod Security Admission's `restricted` profile nor any
# NetworkPolicy.
apiVersion: buddy.k8s-buddy.io/v1alpha1
kind: Plant
metadata:
  namespace: k8s-buddy-plants
  name: stormy
spec:
  species: succulent
  replicas: 3
  chaos:
    enableEndpoints: true
