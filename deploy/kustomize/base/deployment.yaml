apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddy-api
  namespace: k8s-buddy
  labels:
    app.kubernetes.io/name: buddy-api
    app.kubernetes.io/instance: k8s-buddy
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: k8s-buddy
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: buddy-api
      app.kubernetes.io/instance: k8s-buddy
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: buddy-api
        app.kubernetes.io/instance: k8s-buddy
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: k8s-buddy
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: buddy-api
      automountServiceAccountToken: false
      # Pod-level seccompProfile is required in addition to the
      # container-level one below: Pod Security Admission's `restricted`
      # profile checks for it at both scopes, and setting it only on the
      # container leaves the pod itself without a default profile.
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      # Spread the 3 replicas across the cluster's 3 nodes (1 control-plane
      # + 2 workers -- see deploy/kind/kind-config.yaml) so a single node
      # failure can never take out more than one replica.
      # whenUnsatisfiable: ScheduleAnyway (not DoNotSchedule) means the
      # scheduler still places all replicas even if perfect spread isn't
      # achievable, e.g. on a single-node cluster -- this is a demo
      # cluster, not a guarantee the manifest should refuse to schedule
      # under.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: buddy-api
              app.kubernetes.io/instance: k8s-buddy
              app.kubernetes.io/component: api
      # buddy-api's own in-process shutdown sequence (cmd/buddy-api/main.go:
      # gracefulShutdown) already does everything a preStop hook would
      # normally buy: it flips readiness false the instant SIGTERM arrives,
      # then sleeps BUDDY_SHUTDOWN_DELAY (5s default, see the ConfigMap) to
      # let that readiness change propagate through Endpoints/EndpointSlice
      # and every node's kube-proxy before it stops accepting connections.
      #
      # A `lifecycle.preStop` hook is deliberately NOT added here. The
      # conventional `exec: ["sleep", "5"]` preStop cannot work in this
      # image at all -- build/Dockerfile.buddy-api ships
      # distroless/static-debian12:nonroot, which has no /bin/sh and no
      # /bin/sleep to exec into; that preStop would fail every single
      # termination (visible as a FailedPreStopHook event) rather than
      # silently doing nothing. An httpGet-based preStop against /healthz
      # would run, but it would be redundant: it wouldn't delay
      # SIGTERM delivery any earlier or later than terminationGracePeriodSeconds
      # already does, and the in-process delay below is what actually
      # gates the shutdown sequence. terminationGracePeriodSeconds: 30
      # gives the shutdown sequence (5s delay + up to 15s drain + margin)
      # comfortable room before the kubelet SIGKILLs the process.
      terminationGracePeriodSeconds: 30
      containers:
        - name: buddy-api
          image: ghcr.io/sean-kramer/k8s-buddy/buddy-api:dev
          # IfNotPresent, not Always: this image is loaded directly into
          # kind's node containerd via `make kind-load` and is never
          # pushed anywhere `ghcr.io/sean-kramer/k8s-buddy` could actually
          # resolve. imagePullPolicy: Always would make every pod start
          # fail trying (and failing) to pull from a registry that has
          # nothing at this tag.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: buddy-api-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          # periodSeconds: 2 / failureThreshold: 2 on readiness means a pod
          # falling out of (or back into) rotation is visible within ~4s
          # instead of the 30s a default probe cadence would take -- the
          # difference between a demo that's watchable in real time and one
          # that requires narrating "just wait a bit."
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 15
