# buddy-api never talks to the Kubernetes API -- it has no controller loop,
# watches nothing, and creates nothing. automountServiceAccountToken: false
# says so explicitly rather than leaving the default (mounted) token sitting
# in the pod unused: an unused, automatically-mounted token is a needless
# credential for anything that compromises the container to steal.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: buddy-api
  namespace: k8s-buddy
  labels:
    app.kubernetes.io/name: buddy-api
    app.kubernetes.io/instance: k8s-buddy
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: k8s-buddy
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
