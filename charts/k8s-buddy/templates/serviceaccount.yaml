{{- if .Values.serviceAccount.create }}
# The operator's own identity. Its whole job is talking to the Kubernetes
# API -- watching Plants and writing their owned children -- so, unlike
# every generated Plant workload's ServiceAccount (automountServiceAccountToken:
# false), this one's token is mounted into the operator's pod as normal (see
# templates/deployment.yaml, which deliberately never sets that field
# either). templates/clusterrole.yaml and templates/clusterrolebinding.yaml
# are what actually bound what that token can do.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "k8s-buddy.serviceAccountName" . }}
  namespace: {{ include "k8s-buddy.namespace" . }}
  labels:
    {{- include "k8s-buddy.labels" . | nindent 4 }}
{{- end }}
