# The operator's own metrics Service, matching
# deploy/kustomize/operator/service.yaml. Fronts the operator Deployment's
# "metrics" containerPort, which serves over HTTPS with authn/authz enforced
# (filters.WithAuthenticationAndAuthorization, wired in
# cmd/plant-operator/main.go) -- this Service is what tells Prometheus where
# to scrape it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "k8s-buddy.fullname" . }}-metrics
  namespace: {{ include "k8s-buddy.namespace" . }}
  labels:
    {{- include "k8s-buddy.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "k8s-buddy.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
