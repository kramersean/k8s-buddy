# Reproduces config/webhook/manifests.yaml's MutatingWebhookConfiguration
# object (generated by controller-gen from api/v1alpha1/plant_webhook.go's
# own +kubebuilder:webhook marker -- see that file's own header comment) with
# two deliberate differences from the kustomize path: metadata.name and
# clientConfig.service are RELEASE-SCOPED (via k8s-buddy.fullname), the same
# way templates/clusterrole.yaml's own ClusterRole name is, rather than the
# kustomize path's fixed "plant-operator-*" names -- this object is
# cluster-scoped, so two independent installs of this chart must never
# collide on it.
#
# CI's `manifests` job runs `make helm-webhook-drift-check`
# (hack/check-helm-webhook-drift.py), which renders this file's
# `webhooks[].name/.rules/.failurePolicy/.sideEffects/.timeoutSeconds/
# .admissionReviewVersions` and diffs them against config/webhook/
# manifests.yaml (see that script's own comment for why metadata.name and
# clientConfig are excused, mirroring hack/check-helm-rbac-drift.py's own
# resourceNames exclusion) -- a +kubebuilder:webhook marker change must be
# mirrored here the same way a +kubebuilder:rbac marker change must be
# mirrored into clusterrole.yaml.
#
# caBundle is deliberately absent from clientConfig: cmd/plant-operator's own
# certificate bootstrap (docs/adr/0009-webhook-certificate-strategy.md)
# patches it in at every process startup via the RBAC grant
# templates/clusterrole.yaml carries for exactly this object's name.
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "k8s-buddy.fullname" . }}-mutating-webhook-configuration
  labels:
    {{- include "k8s-buddy.labels" . | nindent 4 }}
webhooks:
  - name: mplant-v1alpha1.kb.io
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 5
    clientConfig:
      service:
        name: {{ include "k8s-buddy.fullname" . }}-webhook
        namespace: {{ include "k8s-buddy.namespace" . }}
        path: /mutate-buddy-k8s-buddy-io-v1alpha1-plant
        port: 443
    rules:
      - apiGroups: ["buddy.k8s-buddy.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["plants"]
