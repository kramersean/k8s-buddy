apiVersion: apps/v1
kind: Deployment
metadata:
  name: buddy-api
  namespace: k8s-buddy
  labels:
    app: buddy-api
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: buddy-api
  template:
    metadata:
      labels:
        app: buddy-api
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: buddy-api
        image: buddy-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: RANDOM_500_RATE
          value: "0.1"
        - name: LATENCY_MS
          value: "100"
        - name: READINESS_FAIL_DURATION_SECONDS
          value: "30"
        - name: CRASH_LOOP_AFTER_N_REQUESTS
          value: "0"
        - name: CPU_BURN_SECONDS
          value: "0"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://otel-collector:4317"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
