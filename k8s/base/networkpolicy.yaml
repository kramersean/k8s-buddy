apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: buddy-api-network-policy
  namespace: k8s-buddy
spec:
  podSelector:
    matchLabels:
      app: buddy-api
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: k8s-buddy
    - podSelector:
        matchLabels:
          app: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 4317
