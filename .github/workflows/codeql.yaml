name: CodeQL

# Same push/pull_request-to-main coverage as ci.yaml, plus a weekly schedule
# so dependency/CodeQL query updates get a scan even when nobody pushes code
# that week.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 3 * * 1" # every Monday at 03:17 UTC

# github.event_name is included alongside github.ref: a scheduled run and a
# push both target refs/heads/main, so keying on ref alone would let the
# Monday cron and a same-day main push cancel each other out.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ["go"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: ${{ matrix.language }}
          build-mode: autobuild

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
