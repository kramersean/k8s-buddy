name: CI

# Push and pull_request against main are the only triggers -- this repo does
# development on feature branches and merges into main, so those are the two
# events that matter for "is this safe to merge / did main just break".
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel any in-flight run for the same ref the moment a new commit lands on
# it, so a fast follow-up push doesn't wait behind (or race) a stale run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege at the top: nothing in this workflow needs to write to the
# repo. Jobs that need more (build's package push, scan's SARIF-free trivy
# runs need nothing extra) escalate individually, scoped to just that job.
permissions:
  contents: read

env:
  IMAGE: ghcr.io/sean-kramer/k8s-buddy/buddy-api
  OPERATOR_IMAGE: ghcr.io/sean-kramer/k8s-buddy/plant-operator

jobs:
  # ---------------------------------------------------------------------------
  # lint -- golangci-lint (the pinned version from the Makefile) plus a
  # gofmt check that actually fails on unformatted files. `make fmt` rewrites
  # files in place and would exit 0 either way, so it cannot be the CI gate --
  # this step only ever reads.
  # ---------------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: make lint
        run: make lint

      - name: gofmt check (fails on unformatted files)
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi
          echo "All Go files are gofmt-formatted."

      # Regenerates the CRD (config/crd/bases), RBAC (config/rbac/role.yaml),
      # and deepcopy (api/v1alpha1/zz_generated.deepcopy.go) from the
      # +kubebuilder markers and diffs the result against what's committed.
      # Without this, a marker edit that never got followed by `make
      # generate manifests` -- or a hand-edit to role.yaml or the CRD, both
      # of which are supposed to be generated-only -- would pass CI
      # unnoticed: install-crd in the e2e job below regenerates before
      # applying, so a stale committed manifest is invisible to every other
      # job. `git diff --exit-code` is what actually fails the build on
      # drift, not just recomputing it.
      - name: make manifests generate (assert no drift against committed output)
        run: |
          set -euo pipefail
          make manifests generate
          git diff --exit-code config/ api/

  # ---------------------------------------------------------------------------
  # test -- ubuntu-latest has a C toolchain, so this is where the race
  # detector actually runs (the Windows dev box cannot run it). Both the
  # race run and the coverage run execute the full suite; the coverage
  # profile is uploaded so it is inspectable from the Actions UI.
  # ---------------------------------------------------------------------------
  test:
    name: test
    runs-on: ubuntu-latest
    # 20, not 10: this job also runs make test-envtest, which downloads the
    # envtest control-plane binaries (etcd, kube-apiserver, kubectl) on
    # first run and boots a real control plane -- both real wall-clock costs
    # test-race/test-cover above never had to pay.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: make test-race
        run: make test-race

      - name: make test-cover
        run: make test-cover

      - name: Upload coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: coverage-profile
          path: coverage.out
          if-no-files-found: error

      # The envtest controller suite (internal/controller/{suite,
      # plant_controller,counting_client}_test.go) is gated behind the
      # "envtest" build tag specifically so `make test` above stays fast and
      # dependency-free -- but that means it runs NOWHERE automatically
      # unless something in CI calls `make test-envtest` explicitly, which is
      # exactly what this step does. `make test-envtest` installs the pinned
      # setup-envtest into .tools/ (Makefile's own pinned-tool pattern) and
      # uses it to download the matching 1.36.x kube-apiserver/etcd/kubectl
      # binaries on first run, then boots a real control plane against them.
      # ubuntu-latest is used for the whole `test` job (not the Windows dev
      # box) specifically because it has a C toolchain for test-race above,
      # and because Windows cannot cleanly signal etcd.exe/kube-apiserver.exe
      # for teardown -- see suite_test.go's own comments for why that
      # matters locally but is a non-issue here.
      - name: make test-envtest
        run: make test-envtest

  # ---------------------------------------------------------------------------
  # build -- multi-arch image build. Pushing to ghcr.io only happens on a
  # push to main; a PR (including one from a fork) never gets push:true, so
  # it can never publish an image using this repo's GITHUB_TOKEN. packages:
  # write is scoped to this job alone.
  # ---------------------------------------------------------------------------
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image metadata
        id: vars
        run: |
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # No QEMU setup step, deliberately. build/Dockerfile.buddy-api pins
      # its builder stage to --platform=$BUILDPLATFORM and compiles with
      # GOOS=$TARGETOS/GOARCH=$TARGETARCH, so the linux/arm64 leg is
      # cross-compiled on the amd64 runner rather than emulated, and the
      # final stage is a COPY with no RUN. Nothing built for arm64 is ever
      # executed during the build, so there is no binfmt handler for
      # GitHub-hosted runners to be missing.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build buddy-api (push only on a push to main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile.buddy-api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.version }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}

      # Same treatment, same gating, as buddy-api above: a portfolio repo
      # that multi-arch-builds and pushes one of its two images but not the
      # other invites the question of why. build/Dockerfile.plant-operator
      # is cross-compiled the same way (--platform=$BUILDPLATFORM,
      # GOOS/GOARCH=$TARGETOS/$TARGETARCH, COPY-only final stage), so this
      # needs no QEMU either.
      - name: Build plant-operator (push only on a push to main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile.plant-operator
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ env.OPERATOR_IMAGE }}:${{ steps.vars.outputs.version }}
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}

      # SBOM is generated from source (go.sum et al.), not from a built
      # image: a PR build above is intentionally push:false/load:false (a
      # multi-platform buildx build cannot be --load'ed into the local
      # daemon), so on a PR there is no local image to point sbom-action at.
      # A path-based SBOM works identically for both push and PR events, and
      # covers both binaries' dependencies in one pass since they share a
      # single go.mod -- a second, per-binary SBOM would be a duplicate of
      # the same source tree, not additional coverage.
      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: k8s-buddy-sbom.spdx.json
          upload-artifact: true
          artifact-name: k8s-buddy-sbom.spdx.json

  # ---------------------------------------------------------------------------
  # scan -- trivy over the filesystem (deps/config, always available) and
  # over the built image. This job builds its own single-platform,
  # push:false/load:true image rather than depending on `build`'s output:
  # build's own image is push:false/unloaded on a PR (nothing to pull), and
  # pulling from ghcr would also require an image a fork PR was never
  # allowed to push. Because scan is fully self-sufficient, it deliberately
  # has no `needs: build` -- a `needs` here would only serialize scan behind
  # the slower multi-arch build and let a build failure suppress scanning
  # entirely, without buying scan anything it actually depends on.
  # ---------------------------------------------------------------------------
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image metadata
        id: vars
        run: |
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build buddy-api image locally for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile.buddy-api
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:scan
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}

      # Same treatment as buddy-api: built locally (load: true) rather than
      # pulled, for the same fork-PR reason described in this job's own
      # header comment.
      - name: Build plant-operator image locally for scanning
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile.plant-operator
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.OPERATOR_IMAGE }}:scan
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
            COMMIT=${{ steps.vars.outputs.commit }}

      # Filesystem scan covers the whole repository (scan-ref: .) in one
      # pass -- both cmd/buddy-api and cmd/plant-operator source and their
      # shared go.sum -- so there is only one of these, not one per binary.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy image scan (buddy-api)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:scan
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Trivy image scan (plant-operator)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.OPERATOR_IMAGE }}:scan
          severity: HIGH,CRITICAL
          exit-code: "1"

  # ---------------------------------------------------------------------------
  # manifests -- kubeconform in strict mode against real upstream Kubernetes
  # schemas. kubeconform does not understand kustomize overlays, so the
  # kustomization is rendered first with `kubectl kustomize` and piped in.
  # ---------------------------------------------------------------------------
  manifests:
    name: manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: "v1.36.1"

      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          sudo tar -xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
          kubeconform -v

      # shell: bash (rather than the default `bash -e {0}`) is required so
      # `set -o pipefail` is in effect: without it, a failure in `kubectl
      # kustomize` would be masked by kubeconform's own exit code, and
      # kubeconform on empty stdin reports "0 resources, 0 errors" and exits
      # 0 -- a broken kustomization.yaml would silently PASS this job.
      - name: Validate deploy/kustomize/base (strict, real k8s schemas)
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize deploy/kustomize/base | \
            kubeconform -strict -summary -kubernetes-version 1.36.1 -

      - name: Validate deploy/kustomize/operator (strict, real k8s schemas)
        shell: bash
        run: |
          set -euo pipefail
          kubectl kustomize deploy/kustomize/operator | \
            kubeconform -strict -summary -kubernetes-version 1.36.1 -

  # ---------------------------------------------------------------------------
  # e2e -- the important one. Stands up the same 3-node kind topology CI and
  # local dev both use, deploys buddy-api, and runs hack/demo.sh as a real
  # assertion: it deletes a live pod and hack/demo.sh's exit code is the
  # pass/fail signal for whether Kubernetes actually healed it. No || true,
  # no continue-on-error -- a chaos injection that doesn't recover must turn
  # this job red.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # `make install-crd` -> `manifests` -> `go install
      # sigs.k8s.io/controller-tools/cmd/controller-gen@v0.21.0` (the
      # Makefile's pinned-tool pattern). Without this step, that `go
      # install` would silently run against whatever Go the runner image
      # happens to preinstall -- unpinned, unlike every other job here,
      # which all pin go-version-file: go.mod.
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Same node topology, same node image, as local dev
      # (deploy/kind/kind-config.yaml pins kindest/node:v1.36.1, 3 nodes).
      - name: Create kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          config: deploy/kind/kind-config.yaml
          cluster_name: k8s-buddy
          version: "v0.32.0"
          kubectl_version: "v1.36.1"

      - name: make docker-build
        run: make docker-build

      # Loads BOTH the git-SHA tag and the :dev tag. `make deploy` pins the
      # SHA tag; :dev is what a bare `kubectl apply -k deploy/kustomize/base`
      # would ask for, so loading both keeps either path schedulable.
      - name: make kind-load
        run: make kind-load

      - name: make deploy
        run: make deploy

      - name: Wait for rollout
        run: kubectl -n k8s-buddy rollout status deployment/buddy-api --timeout=120s

      # This is the assertion. Its exit code (0 = healed, 2 = recovery
      # timeout, 1 = missing prerequisite) IS the job's pass/fail signal.
      - name: Run self-healing demo (chaos + recovery assertion)
        run: bash hack/demo.sh

      # ---------------------------------------------------------------------
      # Plan 2: the operator, exercised end to end on the same live cluster
      # the Plan 1 demo above just proved buddy-api on. This installs the
      # Plant CRD, builds and deploys plant-operator, applies the fernie
      # sample, and -- the headline result of Plan 2 -- deletes the Plant and
      # asserts every one of its five owned children is actually gone.
      # envtest (internal/controller's suite, run in the `test` job) cannot
      # demonstrate cascading garbage collection at all: it runs no garbage-
      # collector controller. This is the only place in CI that can.
      # ---------------------------------------------------------------------

      - name: make install-crd
        run: make install-crd

      - name: make docker-build-operator
        run: make docker-build-operator

      - name: make kind-load-operator
        run: make kind-load-operator

      - name: make deploy-operator
        run: make deploy-operator

      - name: Operator pod is Running and Ready
        run: |
          set -euo pipefail
          kubectl -n k8s-buddy-system wait --for=condition=Available deployment/plant-operator --timeout=120s
          kubectl -n k8s-buddy-system get pods -o wide

      - name: Apply the fernie Plant sample
        run: kubectl apply -f config/samples/plant-fernie.yaml

      - name: Wait for the operator to report all replicas ready
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            desired="$(kubectl get plant fernie -o jsonpath='{.spec.replicas}' 2>/dev/null || true)"
            ready="$(kubectl get plant fernie -o jsonpath='{.status.readyReplicas}' 2>/dev/null || true)"
            if [ -n "$desired" ] && [ -n "$ready" ] && [ "$ready" = "$desired" ]; then
              echo "fernie ready: readyReplicas=$ready desiredReplicas=$desired"
              exit 0
            fi
            echo "waiting for fernie: readyReplicas=${ready:-<unset>} desiredReplicas=${desired:-<unset>} (attempt $i/60)"
            sleep 5
          done
          echo "fernie never reached status.readyReplicas == spec.replicas" >&2
          exit 1

      - name: Assert kubectl get plants shows a non-empty MOOD
        run: |
          set -euo pipefail
          kubectl get plants
          mood="$(kubectl get plant fernie -o jsonpath='{.status.mood}')"
          if [ -z "$mood" ]; then
            echo "status.mood is empty; expected a populated Mood" >&2
            exit 1
          fi
          echo "fernie mood: $mood"

      - name: Curl fernie's Service and confirm /status responds
        run: |
          set -euo pipefail
          kubectl run curl-fernie --image=curlimages/curl:8.11.1 --restart=Never --rm -i \
            --command -- curl -sf --max-time 5 http://fernie.default.svc.cluster.local/status

      # Asserts the count, not just that the command exits 0: `kubectl get`
      # against a selector that matches nothing still exits 0 and merely
      # prints "No resources found" -- a step that only ran the command
      # would pass vacuously if the label selector ever stopped matching,
      # which would make the "after" wait loop below see remaining=0 on its
      # very first iteration and report a false GC pass having proven
      # nothing at all. Failing loudly here if the count isn't exactly 5 is
      # what keeps the flagship assertion below honest.
      - name: Children exist before deletion (the "before" half of the GC proof)
        run: |
          set -euo pipefail
          kubectl get deploy,svc,cm,pdb,sa -l buddy.k8s-buddy.io/plant=fernie
          before="$(kubectl get deploy,svc,cm,pdb,sa -l buddy.k8s-buddy.io/plant=fernie --no-headers | wc -l)"
          if [ "$before" -ne 5 ]; then
            echo "expected exactly 5 children before delete, saw $before -- the GC proof below would be meaningless" >&2
            exit 1
          fi
          echo "confirmed: 5 children present before delete"

      # THE GARBAGE COLLECTION PROOF. This is what envtest structurally
      # cannot show (no garbage-collector controller runs there) and the
      # reason Task 5 exists as a live-cluster task at all.
      - name: Delete the Plant and assert all five children are garbage-collected
        run: |
          set -euo pipefail
          kubectl delete plant fernie --wait=true --timeout=60s
          for i in $(seq 1 30); do
            remaining="$(kubectl get deploy,svc,cm,pdb,sa -l buddy.k8s-buddy.io/plant=fernie --no-headers 2>/dev/null | wc -l)"
            if [ "$remaining" -eq 0 ]; then
              echo "all five children garbage-collected"
              exit 0
            fi
            echo "waiting for garbage collection: $remaining child object(s) remaining (attempt $i/30)"
            sleep 2
          done
          echo "one or more owned children survived Plant deletion:" >&2
          kubectl get deploy,svc,cm,pdb,sa -l buddy.k8s-buddy.io/plant=fernie >&2 || true
          exit 1

      - name: RBAC is actually scoped (plant-operator must NOT be able to touch nodes or secrets)
        run: |
          set -euo pipefail
          if kubectl auth can-i --as=system:serviceaccount:k8s-buddy-system:plant-operator delete nodes | grep -qx yes; then
            echo "plant-operator can delete nodes -- RBAC is not scoped" >&2
            exit 1
          fi
          if kubectl auth can-i --as=system:serviceaccount:k8s-buddy-system:plant-operator get secrets -A | grep -qx yes; then
            echo "plant-operator can read secrets cluster-wide -- RBAC is not scoped" >&2
            exit 1
          fi
          if ! kubectl auth can-i --as=system:serviceaccount:k8s-buddy-system:plant-operator update plants/status -n k8s-buddy | grep -qx yes; then
            echo "plant-operator cannot update plants/status in its own working namespace -- RBAC is too narrow" >&2
            exit 1
          fi
          echo "RBAC scoping confirmed: no nodes, no cluster-wide secrets, yes plants/status"

      - name: Dump diagnostics on failure
        if: failure()
        run: |
          echo "=== buddy-api pods ==="
          kubectl -n k8s-buddy get pods -o wide || true
          echo "=== describe buddy-api pods ==="
          kubectl -n k8s-buddy describe pods -l app.kubernetes.io/name=buddy-api || true
          echo "=== buddy-api logs (current) ==="
          kubectl -n k8s-buddy logs -l app.kubernetes.io/name=buddy-api --all-containers --tail=200 || true
          echo "=== buddy-api logs (previous, if any container restarted) ==="
          kubectl -n k8s-buddy logs -l app.kubernetes.io/name=buddy-api --all-containers --tail=200 --previous || true
          echo "=== buddy-api events ==="
          kubectl -n k8s-buddy get events --sort-by=.lastTimestamp || true
          echo "=== plant-operator pods ==="
          kubectl -n k8s-buddy-system get pods -o wide || true
          echo "=== describe plant-operator pods ==="
          kubectl -n k8s-buddy-system describe pods -l app.kubernetes.io/name=plant-operator || true
          echo "=== plant-operator logs ==="
          kubectl -n k8s-buddy-system logs deploy/plant-operator --all-containers --tail=500 || true
          echo "=== plant-operator events ==="
          kubectl -n k8s-buddy-system get events --sort-by=.lastTimestamp || true
          echo "=== fernie Plant ==="
          kubectl get plant fernie -o yaml || true
          kubectl describe plant fernie || true
          echo "=== fernie's owned children (if any remain) ==="
          kubectl get deploy,svc,cm,pdb,sa -l buddy.k8s-buddy.io/plant=fernie -o wide || true
          echo "=== default namespace events ==="
          kubectl get events -n default --sort-by=.lastTimestamp || true
